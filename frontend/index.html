<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerX — Skill &amp; Job Readiness Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body {
      background: linear-gradient(135deg, #f4f7fb 0%, #eef2f6 100%);
      color: #1e293b;
      min-height: 100vh;
      padding: 32px 20px;
    }
    .container { max-width: 980px; margin: 0 auto; }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; margin-bottom: 26px;
      background: #ffffff;
      padding: 18px 24px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }
    .brand { font-size: 26px; font-weight: 800; color: #0f766e; letter-spacing: -0.5px; }
    .sub { color: #64748b; font-size: 14px; }
    .status-pill {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .grid { display: grid; grid-template-columns: 1fr 1.45fr; gap: 22px; }
    @media (max-width: 780px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.04);
    }
    .card h2 { font-size: 17px; font-weight: 700; margin-bottom: 16px; color: #0f172a; }

    label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
    select, input[type="number"] {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a;
      font-size: 14px; font-weight: 500; margin-bottom: 12px;
      transition: border-color 0.2s, background 0.2s;
    }
    select:focus, input[type="number"]:focus {
      outline: none;
      border-color: #0d9488;
      background: #ffffff;
    }
    .skill-row {
      display: grid; grid-template-columns: 1fr 90px; gap: 10px; align-items: center;
      margin-bottom: 10px;
    }
    .skill-row label { margin: 0; font-weight: 500; color: #334155; }
    .skill-row input { margin: 0; text-align: center; }

    button {
      width: 100%; margin-top: 16px; padding: 12px;
      border: none; border-radius: 10px;
      background: linear-gradient(90deg, #0f766e, #0d9488);
      color: #ffffff; font-weight: 600; font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.22);
      transition: transform 0.15s, opacity 0.2s;
    }
    button:hover { opacity: 0.94; transform: translateY(-1px); }

    .score-box {
      display: flex; align-items: center; justify-content: space-between;
      background: #f0fdfa; border-radius: 14px; padding: 18px 20px; margin-bottom: 18px;
      border: 1px solid #ccfbf1;
    }
    .score-num { font-size: 36px; font-weight: 800; color: #0f766e; }

    .bar-wrap { margin-bottom: 15px; }
    .bar-top { display: flex; justify-content: space-between; font-size: 13px; color: #334155; margin-bottom: 6px; gap: 8px; flex-wrap: wrap; }
    .track { width: 100%; height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; background: linear-gradient(90deg, #14b8a6, #0284c7); border-radius: 999px; transition: width 0.35s ease; }

    .badge {
      display: inline-block; padding: 5px 11px; border-radius: 999px;
      font-size: 12px; font-weight: 600; margin-right: 6px; margin-top: 6px;
      background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
    }
    .project-box {
      margin-top: 16px; padding: 14px 16px; border-radius: 12px;
      background: #f0f9ff; border: 1px solid #bae6fd;
      color: #0369a1; font-size: 14px; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <div class="brand">CareerX</div>
        <div class="sub">AI-Powered Employability &amp; Skill Intelligence Dashboard</div>
      </div>
      <div class="status-pill" id="apiStatusText">Connecting...</div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>1. Apna Target &amp; Skill Score Daalo</h2>
        <label for="roleSelect">Target Role</label>
        <select id="roleSelect" onchange="renderSkillInputs()">
          <option value="Data Analyst">Data Analyst</option>
          <option value="AI/ML Engineer">AI/ML Engineer</option>
        </select>

        <div id="skillInputs"></div>

        <button onclick="analyzeSkills()">Analyze Skill Gap</button>
      </div>

      <div class="card">
        <h2>2. Career X-Ray Report</h2>

        <div class="score-box">
          <div>
            <div class="sub" style="color:#0f766e; font-weight:600;">Job Readiness Score</div>
            <div id="roleTitle" style="font-weight:700; font-size:18px; color:#0f172a; margin-top:3px;">Data Analyst</div>
          </div>
          <div class="score-num" id="readinessScore">--/100</div>
        </div>

        <div id="barsContainer">
          <div class="sub">"Analyze Skill Gap" dabao — yahan tumhara skill breakdown dikhega.</div>
        </div>

        <div style="margin-top: 16px;">
          <div class="sub" style="font-weight:600; color:#475569;">Top Skill Gaps (Priority):</div>
          <div id="gapsContainer"></div>
        </div>

        <div class="project-box" id="projectBox" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script>
    const RENDER_BACKEND_URL = "https://careerx-backend-b406.onrender.com";

    const API_BASE = RENDER_BACKEND_URL.trim().replace(/\/+$/, "");
    document.getElementById("apiStatusText").innerText = "● API: Live on Render";

    const ROLE_SKILLS = {
      "Data Analyst": { "Excel": 94, "Python": 81, "Stats": 67, "SQL": 48, "Power BI": 31 },
      "AI/ML Engineer": { "Python": 80, "SQL": 65, "Machine Learning": 60, "Deep Learning": 45, "LLM / NLP": 50 }
    };

    function renderSkillInputs() {
      const role = document.getElementById("roleSelect").value;
      const skills = ROLE_SKILLS[role];
      const container = document.getElementById("skillInputs");
      container.innerHTML = "";

      for (const [skill, defaultVal] of Object.entries(skills)) {
        container.innerHTML += `
          <div class="skill-row">
            <label for="skill_${skill}">${skill} (0–100)</label>
            <input type="number" id="skill_${skill}" min="0" max="100" value="${defaultVal}" />
          </div>
        `;
      }
    }

    async function analyzeSkills() {
      const role = document.getElementById("roleSelect").value;
      const skills = ROLE_SKILLS[role];
      const demonstrated = {};

      for (const skill of Object.keys(skills)) {
        const val = Number(document.getElementById(`skill_${skill}`).value || 0);
        demonstrated[skill] = Math.max(0, Math.min(100, val));
      }

      try {
        const res = await fetch(`${API_BASE}/analyze`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ target_role: role, demonstrated_skills: demonstrated })
        });
        const data = await res.json();
        renderReport(data);
      } catch (err) {
        alert("Render backend abhi wake up ho raha hai ya connect nahi ho pa raha. 20-30 sec baad dobara dabao.");
      }
    }

    function renderReport(data) {
      document.getElementById("roleTitle").innerText = data.target_role;
      document.getElementById("readinessScore").innerText = `${data.job_readiness_score}/100`;

      const bars = document.getElementById("barsContainer");
      bars.innerHTML = "";
      data.skills.forEach(item => {
        bars.innerHTML += `
          <div class="bar-wrap">
            <div class="bar-top">
              <span><b>${item.skill}</b> — Tumhara: ${item.demonstrated}% | Required: ${item.required}%</span>
              <span>Gap: ${item.gap}% (${item.status})</span>
            </div>
            <div class="track">
              <div class="fill" style="width: ${item.demonstrated}%;"></div>
            </div>
          </div>
        `;
      });

      const gaps = document.getElementById("gapsContainer");
      gaps.innerHTML = data.top_skills_gap.length
        ? data.top_skills_gap.map(g => `<span class="badge">${g.skill}: -${g.gap}% (${g.status})</span>`).join("")
        : `<span class="sub">Koi major gap nahi hai!</span>`;

      const proj = document.getElementById("projectBox");
      proj.style.display = "block";
      proj.innerHTML = `<b>Recommended Project:</b> ${data.recommended_project}`;
    }

    renderSkillInputs();
    analyzeSkills();
  </script>
</body>
</html>
